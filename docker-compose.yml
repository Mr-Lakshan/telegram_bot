# Restructured (Paket-Layout). Laufzeit-Pfade bleiben relativ (wie bisher) —
# command = python -m bot.main + PYTHONPATH=/app/src.
#
# ── bot_data.db is mounted as a DIRECTORY, not as a file ────────────────────
#
# It used to be "./bot_data.db:/app/bot_data.db". A single-file bind mount shares
# exactly that one file — but SQLite in WAL mode keeps committed rows in
# bot_data.db-wal next to it, and folds them into the main file only at a
# checkpoint. Those -wal and -shm files were being created inside each
# container, where nothing else could see them.
#
# Two consequences, both observed:
#
#   1. Rows written by the bot never appeared on the host. The container had
#      id 16957; the host file still ended at 16955 and had not been touched
#      for hours.
#
#   2. Worse: -shm is how concurrent SQLite processes coordinate their locking.
#      Three containers each had a private one, so each believed it was the only
#      writer. That is the actual route to a corrupted database.
#
# Mounting the directory puts bot_data.db, -wal and -shm all on the host, where
# every container shares them. /app/bot_data.db is a symlink into that directory
# (created in the Dockerfile), so the relative paths throughout the code keep
# working unchanged — SQLite resolves the symlink and places -wal beside the
# real file.

services:
  telegram_bot:
    build: .
    container_name: telegram_bot
    working_dir: /app
    command: python -m bot.main
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
    restart: always
    ports:
      - "5002:5002"
    volumes:
      - ./dbdata:/app/dbdata
      - ./bot_session.session:/app/bot_session.session
      - ./main_session.session:/app/main_session.session
      - ./user_session.session:/app/user_session.session
      - ./learning_data.db:/app/learning_data.db          # optional, für Persistenz
      - ./calendar_token.json:/app/calendar_token.json     # optional, für Persistenz
    env_file:
      - .env

  dashboard:
    build: .
    container_name: dashboard
    working_dir: /app
    command: python services/dashboard/dashboard_groups.py
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./dbdata:/app/dbdata
    env_file:
      - .env

  group_creator:
    build: ./services/group_creation
    container_name: group_creator
    command: python app.py
    restart: always
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - ./group_creator_session.session:/app/group_creator_session.session
      - ./dbdata:/app/dbdata
    env_file:
      - .env
# ── transcription_api wurde am 04.09.2026 entfernt ──────────────────────────
#
# Der Dienst lief hier auf Port 5003 und wurde von crm/admin/transcription.php
# über admin/transcribe_proxy.php angesprochen. Beides ist weg: die
# Transkription läuft jetzt im video-translate-Dienst als Auftragsart
# "transcribe".
#
# Drei Gründe, alle beobachtet:
#
#   1. Eine Anfrage blieb von der Datei bis zur fertigen Analyse offen. Der
#      CRM-Host bricht nach 60 Sekunden ab, eine Transkription dauert länger.
#   2. Die Datei ging zweimal über das Netz und musste in die 32-MB-Grenze des
#      CRM-Hosts passen. Der video-translate-Dienst nimmt sie direkt entgegen.
#   3. Nichts wurde gespeichert. Tab zu, Ergebnis weg.
#
# Nebenbei behoben: dieser Port war als "5003:5003" veröffentlicht, also aus
# dem Internet erreichbar, während der Dienst die Schlüsselprüfung bei nicht
# gesetztem TRANSCRIBE_API_KEY komplett übersprang.
#
# Der Container baute außerdem aus dem Bot-Image und importierte
# bot.handlers.construction_video_handler — die Transkription im CRM hing damit
# am Code des Telegram-Bots. Auch diese Kopplung ist weg.
#
# Zum Aufräumen auf dem Server:
#   docker compose stop transcription_api && docker compose rm -f transcription_api
#
# services/group_creation/transcription_api_app.py und
# crm/admin/transcribe_proxy.php können gelöscht werden.